<!DOCTYPE html>
<html>

<head>
    <title>Blockchain Cab</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
</head>

<body>
    <h1>Blockchain Cab System</h1>

    <div id="driver">
        <h2>Driver Section</h2>
        <input id="driverName" placeholder="Your name">
        <input id="carModel" placeholder="Car model">
        <button onclick="registerDriver()">Register as Driver</button>
    </div>

    <div id="rider">
        <h2>Rider Section</h2>
        <input id="pickup" placeholder="Pickup location">
        <input id="drop" placeholder="Drop location">
        <input id="fare" placeholder="Fare in ETH">
        <button onclick="requestRide()">Request Ride</button>
    </div>

    <script>
        const contractAddress = "0x5FbDB2315678afecb367f032d93F642f64180aa3";
        const abi = [{ "inputs": [{ "internalType": "uint256", "name": "_rideId", "type": "uint256" }], "name": "acceptRide", "outputs": [], "stateMutability": "nonpayable", "type": "function" }, { "inputs": [{ "internalType": "uint256", "name": "_rideId", "type": "uint256" }], "name": "completeRide", "outputs": [], "stateMutability": "nonpayable", "type": "function" }, { "inputs": [{ "internalType": "address", "name": "", "type": "address" }], "name": "drivers", "outputs": [{ "internalType": "address", "name": "driverAddress", "type": "address" }, { "internalType": "string", "name": "name", "type": "string" }, { "internalType": "string", "name": "carModel", "type": "string" }, { "internalType": "bool", "name": "isAvailable", "type": "bool" }, { "internalType": "uint256", "name": "totalRides", "type": "uint256" }], "stateMutability": "view", "type": "function" }, { "inputs": [{ "internalType": "string", "name": "_name", "type": "string" }, { "internalType": "string", "name": "_carModel", "type": "string" }], "name": "registerDriver", "outputs": [], "stateMutability": "nonpayable", "type": "function" }, { "inputs": [{ "internalType": "string", "name": "_name", "type": "string" }, { "internalType": "string", "name": "_carModel", "type": "string" }], "name": "registerDriver", "outputs": [], "stateMutability": "nonpayable", "type": "function" }, { "inputs": [{ "internalType": "string", "name": "_pickup", "type": "string" }, { "internalType": "string", "name": "_drop", "type": "string" }], "name": "requestRide", "outputs": [], "stateMutability": "payable", "type": "function" }, { "inputs": [], "name": "rideCounter", "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }], "stateMutability": "view", "type": "function" }, { "inputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }], "name": "rides", "outputs": [{ "internalType": "uint256", "name": "rideId", "type": "uint256" }, { "internalType": "address", "name": "rider", "type": "address" }, { "internalType": "address", "name": "driver", "type": "address" }, { "internalType": "string", "name": "pickupLocation", "type": "string" }, { "internalType": "string", "name": "dropLocation", "type": "string" }, { "internalType": "uint256", "name": "fare", "type": "uint256" }, { "internalType": "bool", "name": "isCompleted", "type": "bool" }, { "internalType": "bool", "name": "isPaid", "type": "bool" }], "stateMutability": "view", "type": "function" }];

        async function registerDriver() {
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            const signer = provider.getSigner();
            const contract = new ethers.Contract(contractAddress, abi, signer);

            const name = document.getElementById("driverName").value;
            const car = document.getElementById("carModel").value;

            await contract.registerDriver(name, car);
            alert("Registered!");
        }

        async function requestRide() {
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            const signer = provider.getSigner();
            const contract = new ethers.Contract(contractAddress, abi, signer);

            const pickup = document.getElementById("pickup").value;
            const drop = document.getElementById("drop").value;
            const fare = document.getElementById("fare").value;

            await contract.requestRide(pickup, drop, {
                value: ethers.utils.parseEther(fare)
            });
            alert("Ride requested!");
        }
    </script>
</body>

</html>
